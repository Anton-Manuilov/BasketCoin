[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./invariant-stats" }, { access = "read-write", path = "./deployments" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 50
fail_on_revert = false
show_metrics = true

# Профиль для CI и предаудиторской проверки: FOUNDRY_PROFILE=ci forge test
[profile.ci]
fuzz = { runs = 10000 }
invariant = { runs = 1000, depth = 200, fail_on_revert = false, show_metrics = true }
verbosity = 2

[lint]
# Тесты: моки и handler намеренно используют приведения типов и block.timestamp после vm.warp.
ignore = ["test/**/*.sol"]
